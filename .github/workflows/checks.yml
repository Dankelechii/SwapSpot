name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  escaping:
    name: escaping in markup templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # that index.html parses at all- main is the deploy branch
      - run: node tools/check-syntax.js

      # that the checker still catches the holes it was written for
      - run: node tools/check-escaping.test.js

      # that index.html has no unescaped interpolation reaching the page
      - run: node tools/check-escaping.js
