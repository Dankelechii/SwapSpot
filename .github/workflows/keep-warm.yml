name: keep supabase warm

# A free Supabase project pauses after about a week with no requests, and the
# app does not fail loudly when that happens- it falls back to demo listings
# and quietly refuses sign-ins. That is the worst possible state to send a
# visitor into, so this makes one request a day to keep the project awake.
#
# It sends the publishable key, which is already public in index.html, and
# asks for a row. That matters: without a key the request is rejected by the
# API gateway and may never reach Postgres, so it would be a ping that proves
# nothing while reading as a daily success. With the key, PostgREST connects
# as `anon` and actually runs a query. RLS returns no rows, which is fine-
# the point is that the database did some work.
#
# The job FAILS if the host does not answer at all, which is what a paused or
# deleted project looks like. That failure email is the early warning we did
# not have the last time this happened.
#
# Note: GitHub disables scheduled workflows on a public repo after 60 days
# with no commits. If the project goes quiet for that long, re-enable this in
# the Actions tab.

on:
  schedule:
    # 06:17 UTC, an odd minute because everything on the hour is congested
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: ping the project
    runs-on: ubuntu-latest
    steps:
      - name: Run a real query against the database
        env:
          # the publishable key, already shipped in index.html- not a secret
          SUPABASE_ANON_KEY: sb_publishable_UhT3PuPNRVtF51FPv0XUDA_5m-wf4tX
        run: |
          url="https://woxumfxyghqpesooobjq.supabase.co/rest/v1/listings?select=id&limit=1"
          auth="apikey: $SUPABASE_ANON_KEY"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "$auth" "$url" || echo 000)
          echo "HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::error::No response at all. The project is probably paused or deleted- check the Supabase dashboard."
            exit 1
          fi
          if [ "$code" -ge 500 ]; then
            echo "::error::Server error $code. The project may be waking, restoring or broken."
            exit 1
          fi
          echo "Database answered ($code). Project is awake."
