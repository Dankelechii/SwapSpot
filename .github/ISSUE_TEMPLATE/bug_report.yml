name: Bug / weird behaviour
description: Something in the SwapSpot prototype broke, looked wrong, or didn't add up.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stress-testing SwapSpot! The more precise this is, the faster it gets fixed.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, in order?
      placeholder: |
        1. Opened the live demo on iPhone Safari
        2. Tapped "Get started" and filled onboarding
        3. Opened the app in a second tab and requested the same bay
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the wrong number, message, or visual glitch if there was one.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. iPhone 14, Safari 17 or Windows, Firefox 130
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or screen recording
      description: Drag and drop an image/video here if you have one - huge help for anything visual or timing-related.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
